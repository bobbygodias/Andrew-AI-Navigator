name: playwright-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/andrew_ai_navigator/engines/playwright.py"
      - "src/andrew_ai_navigator/engine.py"
      - "src/andrew_ai_navigator/navigator.py"
      - "src/andrew_ai_navigator/perception.py"
      - "src/andrew_ai_navigator/fusion.py"
      - "src/andrew_ai_navigator/visual.py"
      - "src/andrew_ai_navigator/policy.py"
      - "tests/test_playwright_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/playwright-smoke.yml"

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and Playwright
        run: python -m pip install -e '.[dev,playwright]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser smoke test
        run: python -m pytest tests/test_playwright_smoke.py -q
